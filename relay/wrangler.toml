name = "the-last-contract-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

# banco das partidas, telemetria e placar. O id real sai do "npx wrangler d1 create the-last-contract";
# o wrangler dev usa uma copia local e ignora o id
[[d1_databases]]
binding = "DB"
database_name = "the-last-contract"
database_id = "trocar-pelo-id-do-d1-create"
migrations_dir = "migrations"

# apaga o que passou da retencao, uma vez por dia (03:00 em Brasilia)
[triggers]
crons = ["0 6 * * *"]

# no plano gratuito o Durable Object precisa ser da classe com SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala", "Registro"]

# so o console.log do medidor vai para o log; o log de cada requisicao guardaria IP e codigo da sala
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
