name: Release da entrega

on:
  push:
    branches: [main]
    # merge que so mexe no CI ou no README nao vira entrega
    paths-ignore: ['.github/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    uses: ./.github/workflows/build.yml

  # a entrega leva o GDD completo, gerado do mesmo commit dos executáveis
  gdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: gdd.tex
          working_directory: docs

      - uses: actions/upload-artifact@v7
        with:
          name: gdd
          path: docs/gdd.pdf

  release:
    needs: [exportar, gdd]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # a tag leva a data do merge no horario de Brasilia; outro merge no mesmo dia atualiza a mesma release
      - name: Tag da entrega
        id: tag
        run: |
          tag="entrega-$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "data=$(TZ=America/Sao_Paulo date +%d/%m/%Y)" >> "$GITHUB_OUTPUT"
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Entrega ${{ steps.tag.outputs.data }}
          generate_release_notes: true
          make_latest: true
          files: |
            TheLastContract-linux.tar.gz
            TheLastContract-linux.deb
            TheLastContract-windows.zip
            TheLastContract-web.zip
            gdd.pdf

  # a release criada aqui nao dispara outros workflows: o envio ao itch.io e chamado direto
  itch:
    needs: release
    uses: ./.github/workflows/itch.yml
    with:
      versao: ${{ needs.release.outputs.tag }}
    secrets:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    permissions:
      contents: read
      checks: write
      actions: read
