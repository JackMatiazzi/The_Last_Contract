name: Build

# exporta Linux (.tar.gz e .deb) e Windows; roda nos PRs para o main, manualmente e dentro da release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  exportar:
    strategy:
      matrix:
        include:
          - preset: Linux
            pasta: build/linux
            arquivo: TheLastContract.x86_64
            pacote: TheLastContract-linux.tar.gz
          - preset: Windows Desktop
            pasta: build/windows
            arquivo: TheLastContract.exe
            pacote: TheLastContract-windows.zip
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Modelos de exportacao
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/

      - name: Exportar ${{ matrix.preset }}
        run: |
          mkdir -p ${{ matrix.pasta }}
          godot --headless --import
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.pasta }}/${{ matrix.arquivo }}"
          test -s "${{ matrix.pasta }}/${{ matrix.arquivo }}"

      # o tar guarda a permissao de execucao do Linux; o zip e o formato que o Windows abre sem programa extra
      - name: Empacotar
        run: |
          if [ "${{ matrix.preset }}" = "Linux" ]; then
            tar -czf ${{ matrix.pacote }} -C ${{ matrix.pasta }} .
          else
            apt-get update -qq && apt-get install -y -qq zip > /dev/null
            cp tools/jogar-modo-leve.cmd "${{ matrix.pasta }}/Jogar-modo-leve.cmd"
            (cd ${{ matrix.pasta }} && zip -q "$GITHUB_WORKSPACE/${{ matrix.pacote }}" ${{ matrix.arquivo }} Jogar-modo-leve.cmd)
          fi

      - name: Pacote .deb
        if: matrix.preset == 'Linux'
        run: |
          raiz=deb/the-last-contract
          install -Dm755 "${{ matrix.pasta }}/${{ matrix.arquivo }}" "$raiz/usr/bin/the-last-contract"
          install -Dm644 assets/icon/icon.png "$raiz/usr/share/icons/hicolor/512x512/apps/the-last-contract.png"
          install -Dm644 /dev/stdin "$raiz/usr/share/applications/the-last-contract.desktop" <<'ATALHO'
          [Desktop Entry]
          Type=Application
          Name=The Last Contract
          Exec=/usr/bin/the-last-contract
          Icon=the-last-contract
          Terminal=false
          Categories=Game;ActionGame;
          ATALHO
          mkdir -p "$raiz/DEBIAN"
          cat > "$raiz/DEBIAN/control" <<CONTROLE
          Package: the-last-contract
          Version: 0.1.${{ github.run_number }}
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgl1, libvulkan1, libasound2 | libasound2t64, libpulse0
          Maintainer: JackMatiazzi <JackMatiazzi@users.noreply.github.com>
          Description: The Last Contract
           Ação em terceira pessoa para até 4 jogadores contra uma vila tomada por mortos-vivos.
          CONTROLE
          dpkg-deb --root-owner-group --build "$raiz" TheLastContract-linux.deb
          dpkg-deb --info TheLastContract-linux.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pacote }}
          path: ${{ matrix.pacote }}

      - uses: actions/upload-artifact@v7
        if: matrix.preset == 'Linux'
        with:
          name: TheLastContract-linux.deb
          path: TheLastContract-linux.deb
