name: Ponta a ponta

# tres fluxos separados: contrato solo, grupo de 4 pela rede local (ENet) e grupo de 4 por
# WebSocket, o caminho do tunel Cloudflare; tambem roda pelo botao Run workflow da aba Actions
on:
  push:
    branches: [main, desenvolvimento]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.flow }})
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flow: [solo, coop-enet, coop-ws]
    steps:
      - uses: actions/checkout@v7
      - name: Fontes do sistema
        run: apt-get update -qq && apt-get install -y -qq fontconfig > /dev/null
      - run: godot --headless --import
      - run: bash tests/e2e/run_e2e.sh ${{ matrix.flow }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.flow }}
          path: /tmp/the-last-contract-e2e
